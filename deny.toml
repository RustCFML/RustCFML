# cargo-deny configuration.
#
#   cargo deny check licenses
#
# This is the ENFORCEMENT half of license compliance: about.toml/about.hbs
# describe and reproduce the notices, this file fails the build if a crate
# whose terms we have not reviewed enters the dependency graph (e.g. via a
# transitive version bump). Run in CI on every push — see
# .github/workflows/release.yml.

[graph]
# Same target set as about.toml — the four triples we publish binaries for.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = false

[licenses]
# Keep this list in sync with `accepted` in about.toml. A crate arriving under
# anything else is an error, not a warning: strong copyleft (GPL/AGPL/LGPL) in
# a statically linked binary would change RustCFML's own distribution terms.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "MIT-0",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    # Weak copyleft — see the extended note in about.toml before adding more.
    # Present via the default `cluster` (memberlist*) and `html`
    # (cssparser/selectors) features. Used unmodified.
    "MPL-2.0",
]

# Fail if a crate declares no license at all.
unused-allowed-license = "allow"
confidence-threshold = 0.9

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"

[advisories]
# `cargo deny check advisories` runs in CI (licenses.yml) as its own step, so a
# new RustSec advisory against anything in the tree fails the build. Every
# entry below is a REVIEWED exception: why it does not apply, or why it cannot
# be fixed yet. Re-check each when its upstream moves.
yanked = "warn"
ignore = [
    # rsa 0.9 Marvin timing side channel. Fixed only in rsa 0.10, which needs
    # pkcs8 0.11 and so the next p256/p384/p521 generation (release
    # candidates). Used by the java.security Signature shim; exposure needs an
    # attacker able to time many private-key operations.
    { id = "RUSTSEC-2023-0071", reason = "no compatible fix; needs RustCrypto 0.10/0.14 migration" },
    # crypto-bigint 0.5 timing variability, via elliptic-curve 0.13 (p256 &c).
    # Fixed in 0.7, same RustCrypto migration as above.
    { id = "RUSTSEC-2026-0387", reason = "no compatible fix; needs RustCrypto migration" },
    # zip 8 `ZipArchive::extract` / `ZipStreamReader::extract` issues. zip 8 is
    # only umya-spreadsheet's, which reads entries by name and never calls
    # extract(); our own cfzip uses zip 9 and confines every entry itself.
    { id = "RUSTSEC-2026-0367", reason = "extract() unreachable: zip 8 only via umya-spreadsheet" },
    { id = "RUSTSEC-2026-0368", reason = "extract() unreachable: zip 8 only via umya-spreadsheet" },
    { id = "RUSTSEC-2026-0369", reason = "extract() unreachable: zip 8 only via umya-spreadsheet" },
    { id = "RUSTSEC-2026-0429", reason = "extract() unreachable: zip 8 only via umya-spreadsheet" },
    # Unmaintained, no known vulnerability. Tracked for replacement.
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained; cluster wire format, replace when convenient" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash unmaintained; no vulnerability" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; build-time macro only" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; no vulnerability" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained; no vulnerability" },
]

[sources]
unknown-registry = "deny"
unknown-git = "allow"
