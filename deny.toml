# cargo-deny configuration.
#
#   cargo deny check licenses
#
# This is the ENFORCEMENT half of license compliance: about.toml/about.hbs
# describe and reproduce the notices, this file fails the build if a crate
# whose terms we have not reviewed enters the dependency graph (e.g. via a
# transitive version bump). Run in CI on every push — see
# .github/workflows/release.yml.

[graph]
# Same target set as about.toml — the four triples we publish binaries for.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = false

[licenses]
# Keep this list in sync with `accepted` in about.toml. A crate arriving under
# anything else is an error, not a warning: strong copyleft (GPL/AGPL/LGPL) in
# a statically linked binary would change RustCFML's own distribution terms.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "MIT-0",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "NCSA",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # Weak copyleft — see the extended note in about.toml before adding more.
    # Present via the default `cluster` (memberlist*) and `html`
    # (cssparser/selectors) features. Used unmodified.
    "MPL-2.0",
]

# Fail if a crate declares no license at all.
unused-allowed-license = "allow"
confidence-threshold = 0.9

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"

[advisories]
# Security advisories are already covered by Dependabot; keep this check
# non-fatal here so a licence gate failure is never confused with a CVE.
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "allow"
