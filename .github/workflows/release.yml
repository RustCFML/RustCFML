name: Release Binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # License compliance gate. Runs BEFORE the binaries are built so a tag can
  # never ship an artifact whose attribution notice is stale or whose
  # dependency graph has picked up terms we haven't reviewed.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Prebuilt binaries — `cargo install` would compile both tools from
      # source on every tag (several minutes) for no benefit.
      #
      # cargo-about is PINNED on purpose: the staleness check below diffs its
      # output against the committed THIRD-PARTY.txt, so an upstream formatting
      # change would fail the gate spuriously. Bump deliberately, and
      # regenerate THIRD-PARTY.txt in the same commit.
      - name: Install cargo-about + cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.1,cargo-deny@0.20.2

      # Fails the build if any crate in the shipped graph is licensed under
      # terms outside the allow-list in deny.toml.
      - name: Check dependency licenses
        run: cargo deny check licenses

      # THIRD-PARTY.txt is committed (it is include_str!'d into the binary), so
      # it can drift behind a dependency bump. Regenerate and diff.
      - name: Verify THIRD-PARTY.txt is up to date
        run: |
          ./scripts/gen-licenses.sh
          if ! git diff --exit-code -- THIRD-PARTY.txt; then
            echo "::error::THIRD-PARTY.txt is out of date. Run ./scripts/gen-licenses.sh and commit the result."
            exit 1
          fi

  build:
    needs: licenses
    strategy:
      # Do not cancel sibling targets when one fails: a single broken target used to
      # cancel the other three mid-build, so a Windows-only fault looked like a
      # total failure and the healthy targets produced no evidence.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-aarch64
            ext: ""
          - os: ubuntu-latest
            name: linux-x86_64
            ext: ""
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            ext: ""
          - os: windows-latest
            name: windows-x86_64
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # PINNED, not `stable`. A PGO profile is tied to the LLVM version that
      # produced it (rustc 1.93.0 = LLVM 21.1.8), so a silent stable bump would
      # invalidate pgo/rustcfml.profdata and quietly ship an un-profiled binary.
      # Bump this deliberately, and regenerate the profile in the same commit
      # (docs/pgo.md has the recipe).
      - name: Install Rust (pinned for PGO)
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: llvm-tools

      # Fail LOUD rather than degrade quietly. `-Cprofile-use` with an
      # unreadable/incompatible profile is the failure mode that matters: the
      # build succeeds and the binary is simply slower, with nothing to notice.
      - name: Verify the PGO profile is loadable by this toolchain
        shell: bash
        run: |
          PROFDATA=$(find "$(rustc --print sysroot)" -name 'llvm-profdata*' | head -1)
          if [ -z "$PROFDATA" ]; then echo "llvm-profdata not found in sysroot"; exit 1; fi
          "$PROFDATA" show pgo/rustcfml.profdata > profile-summary.txt || {
            echo "::error::pgo/rustcfml.profdata is not readable by rustc $(rustc --version)."
            echo "::error::Regenerate it with docs/pgo.md, or unpin the toolchain."
            exit 1
          }
          FUNCS=$(grep -i 'Total functions' profile-summary.txt | grep -oE '[0-9]+')
          echo "profile carries $FUNCS functions"
          # A profile that has lost most of its functions is stale, not merely old.
          if [ "${FUNCS:-0}" -lt 5000 ]; then
            echo "::error::profile has only $FUNCS functions — expected >5000. Stale?"
            exit 1
          fi

      # Shipped artifacts are PGO'd. `cargo build --release` stays thin-LTO and
      # fast for everyday local use; this profile is fat LTO (see Cargo.toml).
      #
      # ⚠️ RUSTFLAGS goes through `env:`, and this step must NOT set `shell: bash`.
      # v0.595.0's release failed exactly there: `shell: bash` switches the Windows
      # runner to Git-Bash, which puts MSYS Perl (/usr/share/perl5/core_perl) ahead
      # of Strawberry Perl on PATH — and MSYS Perl cannot configure vendored OpenSSL
      # for VC-WIN64A, so openssl-sys's build script dies. The default per-OS shell
      # (pwsh on Windows) has the right Perl. Using `env:` also sidesteps quoting a
      # Windows path that contains backslashes.
      - name: Build (PGO)
        env:
          RUSTFLAGS: -Cprofile-use=${{ github.workspace }}/pgo/rustcfml.profdata
        run: cargo build --profile release-pgo -p rustcfml-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/release-pgo/rustcfml${{ matrix.ext }}

  build-rpm:
    needs: licenses
    runs-on: ubuntu-latest

    container:
      image: rockylinux:9

    steps:
      - uses: actions/checkout@v5

      - name: Install RHEL build dependencies
        run: |
          dnf install -y \
            gcc \
            gcc-c++ \
            binutils \
            git \
            curl \
            findutils \
            file \
            rpm

      - name: Install pinned Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.93.0

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install LLVM tools
        run: |
          . "$HOME/.cargo/env"
          rustup component add llvm-tools

      - name: Install cargo-generate-rpm
        run: |
          . "$HOME/.cargo/env"
          cargo install --locked cargo-generate-rpm

      - name: Verify PGO profile
        run: |
          . "$HOME/.cargo/env"

          PROFDATA=$(find "$(rustc --print sysroot)" \
            -name 'llvm-profdata*' | head -1)

          if [ -z "$PROFDATA" ]; then
            echo "::error::llvm-profdata not found"
            exit 1
          fi

          "$PROFDATA" show \
            pgo/rustcfml.profdata \
            > profile-summary.txt

          FUNCS=$(grep -i 'Total functions' profile-summary.txt \
            | grep -oE '[0-9]+' || true)

          echo "PGO profile carries ${FUNCS:-0} functions"

          if [ "${FUNCS:-0}" -lt 5000 ]; then
            echo "::error::PGO profile appears stale"
            exit 1
          fi

      - name: Build hardened RHEL RPM
        env:
          RUSTFLAGS: -Cprofile-use=${{ github.workspace }}/pgo/rustcfml.profdata
        run: |
          . "$HOME/.cargo/env"
          ./scripts/build-rpm.sh

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: rhel-x86_64-rpm
          path: |
            target/**/*.rpm
            rustcfml-rhel-x86_64.sha256
          if-no-files-found: error

  release:
    needs: [build, build-rpm]
    runs-on: ubuntu-latest
    steps:
      # Needed so LICENSE / THIRD-PARTY.txt can be attached as release assets.
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries
        run: |
          mkdir -p release
          for name in macos-aarch64 linux-x86_64 linux-aarch64; do
            cp "artifacts/${name}/rustcfml" "release/rustcfml-${name}"
            chmod +x "release/rustcfml-${name}"
          done
          cp "artifacts/windows-x86_64/rustcfml.exe" "release/rustcfml-windows-x86_64.exe"
          cp artifacts/rhel-x86_64-rpm/*.rpm release/

      # Ship the notices alongside the binaries.
      - name: Attach license notices
        run: cp LICENSE THIRD-PARTY.txt release/

      - name: Create GitHub Release (edge / prerelease)
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: true
          make_latest: false
          body: |
            **Edge build.** Every push of a version tag publishes here after the full gate (workspace + engine test suites, the CFML suite on the CLI and served in both modes, wasm). It has not yet been run in anger. For the vetted build, take the [latest stable release](https://github.com/RustCFML/RustCFML/releases/latest). An edge build becomes stable by promotion — the same artifacts, no rebuild.
          files: release/*
