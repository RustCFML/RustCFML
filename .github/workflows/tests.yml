name: Tests

# CI ran NO tests of any kind until this existed (GH #415): the workflows were
# deploy-demo, licenses, promote and release, none of which invoke `cargo test`
# or `tests/runner.cfm`. Everything below is a gate that has caught a real
# regression at least once, and the ordering of the jobs is deliberate — the
# cheap ones fail fast.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: cargo test --workspace
        run: cargo test --workspace

      # NOT redundant with the line above. The wasm members depend on cfml-vm
      # with default features stripped, and feature unification then strips them
      # for the whole workspace run — which silently skipped cfml-vm's own
      # suites. Run that crate on its own defaults too.
      - name: cargo test -p cfml-vm
        run: cargo test -p cfml-vm

  cfml:
    name: CFML suite (CLI + serve)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      # The harness throws on failure, so a non-zero exit is the gate.
      - name: CLI
        run: ./target/release/rustcfml tests/runner.cfm

      # Cap eviction test with RUSTCFML_TASKS_LIMIT=3 (must run explicitly)
      - name: CLI - cap eviction
        run: RUSTCFML_TASKS_LIMIT=3 ./target/release/rustcfml tests/run_cap_eviction.cfm

      # Serve mode is a separate gate from the CLI, and production is a separate
      # gate from dev: the bytecode, freshness and component-path caches all
      # behave differently there. Each invocation makes TWO consecutive requests
      # to the SAME process — see the script for why.
      - name: Serve (dev)
        run: ./scripts/serve-gate.sh ./target/release/rustcfml 8610

      # Cap eviction test in serve mode with RUSTCFML_TASKS_LIMIT=3
      - name: Serve (dev) - cap eviction
        run: |
          RUSTCFML_TASKS_LIMIT=3 ./target/release/rustcfml --serve . --port 8612 > /tmp/cap_serve.log 2>&1 &
          PID=$!
          trap "kill $PID 2>/dev/null; wait $PID 2>/dev/null" EXIT
          for i in $(seq 1 30); do
            [ "$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8612/crab.svg)" = "200" ] && break
            sleep 1
          done
          curl -f -m 30 http://127.0.0.1:8612/tests/run_cap_eviction.cfm
          kill $PID 2>/dev/null; wait $PID 2>/dev/null

      - name: Serve (production)
        run: ./scripts/serve-gate.sh ./target/release/rustcfml 8611 --production

  wasm:
    name: wasm targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # A plain `cargo build` does not compile these — they are wasm32-only, so
      # host builds skip them and a broken Cloudflare-worker build reaches
      # downstream consumers with every other gate green (v0.33.0/v0.34.0).
      - name: cargo build --target wasm32-unknown-unknown
        run: cargo build -p cfml-worker -p rustcfml-wasm --target wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0

      # The demo-deploy path. `cargo build --target wasm32` does NOT run
      # wasm-pack/wasm-bindgen, so it cannot catch a broken demo deploy — which
      # is exactly how the v0.240.0 wasm-opt SIGSEGV reached the Action.
      - name: wasm-pack build
        run: wasm-pack build crates/wasm --target web
