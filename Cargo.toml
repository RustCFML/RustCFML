[workspace]
resolver = "2"
members = [
    "crates/cfml-common",
    "crates/cfml-config",
    "crates/cfml-compiler",
    "crates/cfml-codegen",
    "crates/cfml-vm",
    "crates/cfml-stdlib",
    "crates/cfml-qoq",
    "crates/cfml-sanitize",
    "crates/cfml-module-abi",
    "crates/rustcfml-module",
    "examples/native_extension_demo",
    "crates/cli",
    "crates/wasm",
    "crates/cfml-worker",
]
# Native modules under examples/ are standalone crates consumed only by
# `rustcfml --build`. They must not be members of the rustcfml workspace,
# otherwise cargo refuses to build the cocktail build directory nested under
# them.
exclude = [
    "examples/native_module_demo/native/greeter",
    "examples/native_markdown/native/md",
]

[workspace.package]
version = "0.653.6"
authors = ["RustCFML Team"]
edition = "2021"
rust-version = "1.75.0"
repository = "https://github.com/RustCFML/RustCFML"
homepage = "https://github.com/RustCFML/RustCFML"
license = "MIT"

[workspace.dependencies]
cfml-common = { path = "crates/cfml-common", version = "0.653.6" }
cfml-config = { path = "crates/cfml-config", version = "0.653.6" }
cfml-compiler = { path = "crates/cfml-compiler", version = "0.653.6" }
cfml-codegen = { path = "crates/cfml-codegen", version = "0.653.6" }
# `default-features = false` here is what makes a member's own
# `default-features = false` take effect at all: cargo IGNORES that key on an
# inherited (`workspace = true`) dependency unless the workspace entry declares
# it too, warning but building anyway. Without it a member's opt-out is silently
# ignored and the crate's own defaults come back — which is how the CLI once
# linked an entire optional backend it had explicitly disabled.
# Members list the cfml-vm features they want explicitly.
cfml-vm = { path = "crates/cfml-vm", version = "0.653.6", default-features = false }
cfml-stdlib = { path = "crates/cfml-stdlib", version = "0.653.6", default-features = false }
cfml-qoq = { path = "crates/cfml-qoq", version = "0.653.6" }
cfml-sanitize = { path = "crates/cfml-sanitize", version = "0.653.6" }
# The extension ABI. Zero deps and `#[repr(C)]` only, so it is safe to carry
# into the wasm graph as well as the native one.
cfml-module-abi = { path = "crates/cfml-module-abi", version = "0.1.0" }

log = "0.4"
thiserror = "1.0"
anyhow = "1.0"
parking_lot = "0.12"
indexmap = "2.0"
# The raw table behind indexmap, taken directly for `InheritedKeys` (see
# `cfml-vm`). Same version and same `default-features = false` indexmap
# already requests, so this adds no crate and no feature to the graph.
hashbrown = { version = "0.17", default-features = false }
num-traits = "0.2"
rustc-hash = "1.1"
# IANA timezone database for chrono. Pure generated data — compiles on
# wasm32 with no system deps. `case-insensitive` lets us resolve tz ids
# regardless of casing (CFML is case-insensitive everywhere).
chrono-tz = { version = "0.10", features = ["case-insensitive"] }

# Debug builds default to full DWARF for the whole graph, which is what took
# target/debug past 250G. Line tables keep backtraces and profiler symbols
# working; what goes is variable inspection in a debugger, which we can get
# back per-crate when we actually need it.
[profile.dev]
debug = "line-tables-only"

# Third-party deps essentially never get stepped through, and they are the bulk
# of the graph. No debuginfo for them at all.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

# PGO release profile. Separate from `release` on purpose: fat LTO takes the build
# from ~2 min to ~7 min locally, and `cargo build --release` should stay fast for
# everyday use. CI builds shipped artifacts with this profile plus
# `-Cprofile-use=pgo/rustcfml.profdata` — see .github/workflows/release.yml and
# docs/pgo.md.
#
# Measured on a live Preside site (interleaved CPU-time A/B, 5/5 rounds):
# fat LTO alone -1.23%; fat LTO + this profile -14.16% warm CPU and -15.25% boot.
# PGO does essentially all of it.
[profile.release-pgo]
inherits = "release"
lto = "fat"

# Optimized build that keeps debug symbols, for sampling profilers (samply,
# cargo-flamegraph). Build with `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
strip = false
