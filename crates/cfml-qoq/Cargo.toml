[package]
name = "cfml-qoq"
description = "Query-of-Queries engine for RustCFML — in-memory SQL SELECT execution against CfmlQuery objects. Pure Rust, optimised for the subset of SQL needed by CFML QoQ."
keywords = ["cfml", "coldfusion", "qoq", "query-of-queries", "rustcfml"]
categories = ["compilers", "database"]
readme = "../../README.md"
documentation = "https://docs.rs/cfml-qoq"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
# Not published to crates.io — RustCFML ships as binaries. This also keeps
# first-party crates out of THIRD-PARTY.txt: cargo-about only omits
# workspace members that are unpublished, and listing them there made the
# generated notice churn on every version bump (breaking the CI staleness
# gate on every release). Our own terms live in the top-level LICENSE.
publish = false

[dependencies]
cfml-common = { workspace = true }
indexmap = { workspace = true }
regex = "1"
rustc-hash = { workspace = true }

# Rayon parallelism is host-only: the wasm32 targets (cfml-worker, rustcfml-wasm)
# transitively depend on this crate and must not pull in rayon.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"
