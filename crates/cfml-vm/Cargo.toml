[package]
name = "cfml-vm"
description = "Stack-based bytecode VM for the RustCFML interpreter. Executes compiled CFML, dispatches builtin and user-defined functions, and exposes the register_native_fn / register_native_class APIs for Rust-backed extensions."
keywords = ["cfml", "coldfusion", "vm", "interpreter", "rustcfml"]
categories = ["compilers"]
readme = "../../README.md"
documentation = "https://docs.rs/cfml-vm"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
# Not published to crates.io — RustCFML ships as binaries. This also keeps
# first-party crates out of THIRD-PARTY.txt: cargo-about only omits
# workspace members that are unpublished, and listing them there made the
# generated notice churn on every version bump (breaking the CI staleness
# gate on every release). Our own terms live in the top-level LICENSE.
publish = false

[dependencies]
cfml-common = { workspace = true }
cfml-config = { workspace = true }
cfml-qoq = { workspace = true }
cfml-sanitize = { workspace = true }
cfml-module-abi = { workspace = true }
cfml-compiler = { workspace = true }
cfml-stdlib = { workspace = true, default-features = false, optional = true }
indexmap = { workspace = true }
hashbrown = { workspace = true }
cfml-codegen = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
rust_decimal = { version = "1", features = ["maths"] }
chrono = "0.4"
chrono-tz = { workspace = true }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# Pure-Rust, wasm-safe hashers for the java.security.MessageDigest shim's
# digest() (matches the algorithms cfml-stdlib's hash() supports).
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
# Pure-Rust, wasm-safe RSA for the java.security.Signature/KeyFactory shims
# (RSASSA-PKCS1-v1_5 verify + sign, the surface vendored JWT libraries reach
# through createObject("java", …)). `getrandom` stays OFF: PKCS#1 v1.5 signing
# is deterministic and verification needs no entropy, so the shim never draws
# from an RNG and the wasm targets keep building without a random backend.
rsa = { version = "0.9", default-features = false, features = ["std", "sha1", "sha2"] }
# Pure-Rust, wasm-safe NIST-curve ECDSA for the same shims (SHA*withECDSA, the
# ES256/384/512 half of the JWT surface). Signing is RFC 6979 DETERMINISTIC, so
# — exactly like the RSA line above — no `getrandom` backend is pulled in and
# the wasm targets keep building. Key *generation* is the one operation that
# needs entropy; it lives behind `cfg(not(target_arch = "wasm32"))` with the
# `rand_core` dep below, and throws on wasm rather than silently producing a
# weak key.
p256 = { version = "0.13", default-features = false, features = ["std", "ecdsa", "pkcs8"] }
p384 = { version = "0.13", default-features = false, features = ["std", "ecdsa", "pkcs8"] }
p521 = { version = "0.13", default-features = false, features = ["std", "ecdsa", "pkcs8"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["v4", "js"] }

# Cranelift JIT backend. Optional, native-only: the `jit` feature turns these
# on, and they are gated off wasm32 entirely so enabling `jit` on a wasm target
# is a build-time impossibility (mirrors MatchBox). The interpreter is always
# the default and the universal fallback; nothing here changes a default build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# P-521 is the one curve whose signing is NOT deterministic: p521 0.13 has no
# RFC 6979 support yet (its own TODO), so it draws a random nonce and gates
# `sign_prehash` behind `getrandom`. Native-only, therefore, and the P-521
# SIGNING branch is `cfg`-ed off wasm; P-521 *verification* needs no entropy and
# stays available everywhere.
p521 = { version = "0.13", default-features = false, features = ["getrandom"] }
# OS entropy for KeyPairGenerator.generateKeyPair(). Native-only on purpose:
# see the p256/p384/p521 note above — key generation is the ONLY shim operation
# that draws from an RNG, so this is the only place a random backend is needed.
rand_core = { version = "0.6", features = ["getrandom"] }
rustc-hash = { workspace = true, optional = true }
cranelift-jit = { workspace = true, optional = true }
cranelift-module = { workspace = true, optional = true }
cranelift-codegen = { workspace = true, optional = true }
cranelift-frontend = { workspace = true, optional = true }
cranelift-native = { workspace = true, optional = true }

[dev-dependencies]
cfml-stdlib = { workspace = true, default-features = false }
# Exercises the extension ABI from the module side, in-process: everything a
# real `.rcx` does except the dlopen itself.
rustcfml-module = { path = "../rustcfml-module" }

[features]
default = ["std", "real-threads", "jit", "observability", "scope-pool", "component-instance"]
std = []
# Observability & debugging hook bus + the classic CF debug footer (Phase 0/1
# of docs/observability-implementation-plan.md). Pure-Rust, host-only: it pulls
# in NO heavy deps, but is gated off the wasm crates (which build cfml-vm with
# `default-features = false`) so the worker pays nothing and the OS-timer /
# Instant code paths never reach wasm32. When the feature is off, every hook
# call site in the VM vanishes (`#[cfg(feature = "observability")]`), so the
# hot path is byte-identical to a no-observability build.
observability = []
# Call-dispatch Lever D1 (scope pooling) — recycle the per-call owned `locals`
# map through a VM-held free-list instead of allocating/dropping it every call.
# ON by default (listed in `default` above): CPU-neutral and reduces retained
# memory under diverse workloads. Every pool call site is
# `#[cfg(feature = "scope-pool")]`, so disabling it (`--no-default-features` plus
# the other defaults) restores the original per-call allocation. The wasm crates
# build cfml-vm with `default-features = false`, so they never include it. See
# SCOPE_ALLOC_LEVER_PLAN.md §5 Lever D.
scope-pool = []
# Component-model flyweight (Phase C) — propagates to cfml-common. DEFAULT-ON for
# native builds as of v0.519.0 (the Slice-6 flip). The wasm crates build cfml-vm with
# `default-features = false` and do NOT request this feature, so they stay on the
# marker-struct representation. Toggle off with `--no-default-features` + the other
# defaults if the marker path is ever needed on native.
component-instance = ["cfml-common/component-instance"]
# Real OS-thread cfthread support. On by default for native targets; the wasm
# targets (cfml-worker, rustcfml-wasm) build with default-features disabled and
# fall back to the synchronous-inline cfthread path (no std::thread on wasm32).
real-threads = []
s3 = ["dep:cfml-stdlib", "cfml-stdlib/s3"]
# Dynamic op census — see cfml-common's `op-census`. Probe builds only.
op-census = ["cfml-common/op-census"]
# Per-BIF call + argument-shape census — see cfml-common's `bif-census`.
# Probe builds only.
bif-census = ["cfml-common/bif-census"]
# Call-prologue phase attribution — see cfml-common's `call-phases`.
call-phases = ["cfml-common/call-phases"]
# Per-frame exclusive accounting — see cfml-common's `frame-census`.
frame-census = ["cfml-common/frame-census"]
# Existence-probe outcome census — see cfml-common's `exists-census`. Probe
# builds only.
exists-census = ["cfml-common/exists-census"]
# Multi-tier Cranelift JIT. **Default-on for native targets** — included in the
# `default` feature set above. The wasm crates (`cfml-worker`, `rustcfml-wasm`)
# depend on cfml-vm with `default-features = false`, and the cranelift deps
# themselves live under `[target.'cfg(not(target_arch = "wasm32"))'.dependencies]`
# above, so wasm builds get neither the deps nor the code (the `mod jit;`
# declaration in `lib.rs` is also `cfg(not(target_arch = "wasm32"))`). To opt
# out on native, build with `--no-default-features --features std,real-threads`
# or set the runtime kill-switch `RUSTCFML_JIT=0`. See `crates/cfml-vm/src/jit/`.
jit = [
    "dep:rustc-hash",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-native",
]
