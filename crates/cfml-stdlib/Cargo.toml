[package]
name = "cfml-stdlib"
description = "400+ built-in CFML functions for the RustCFML interpreter — strings, arrays, structs, dates, hashing/crypto, HTTP, database (sqlite/mysql/postgres/mssql), XML, HTML, ZIP, and SMTP. Feature-gated so unused subsystems compile out."
keywords = ["cfml", "coldfusion", "stdlib", "builtins", "rustcfml"]
categories = ["compilers", "web-programming"]
readme = "../../README.md"
documentation = "https://docs.rs/cfml-stdlib"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
# Not published to crates.io — RustCFML ships as binaries. This also keeps
# first-party crates out of THIRD-PARTY.txt: cargo-about only omits
# workspace members that are unpublished, and listing them there made the
# generated notice churn on every version bump (breaking the CI staleness
# gate on every release). Our own terms live in the top-level LICENSE.
publish = false

[features]
default = ["http", "database", "xml", "security", "smtp", "html", "zip_support", "yaml", "jsonschema", "image_support", "spreadsheet"]
# Native spreadsheet support — Spreadsheet* BIFs, the fluent Spreadsheet()
# builder, and <cfspreadsheet>. Read+edit+write .xlsx via the pure-Rust
# `umya-spreadsheet` (POI-style open→mutate→save with styles/charts/images
# preserved); legacy .xls/.xlsb reads via `calamine`. Both pure Rust, but this
# whole capability is NATIVE/SERVER-ONLY and is deliberately kept OUT of the
# wasm builds (the worker/demo don't enumerate it), so umya's unverified wasm
# story never touches the wasm targets.
spreadsheet = ["dep:umya-spreadsheet", "dep:calamine", "dep:imagesize"]
# Raster image manipulation (imageNew/imageRead/imageResize/... + <cfimage>).
# Backed by the pure-Rust `image` crate, so it builds for wasm32 as well as
# native. Default features of `image` are all pure-Rust codecs (png/jpeg/gif/
# bmp/tiff/webp/ico/...); AVIF/HEIC (which need C libs) stay OFF so the wasm
# and demo builds keep working.
image_support = ["dep:image", "dep:imageproc", "dep:ab_glyph", "dep:kamadak-exif"]
security = ["rand", "bcrypt", "scrypt", "argon2", "pbkdf2"]
yaml = ["dep:serde_yaml"]
jsonschema = ["dep:jsonschema"]
smtp = ["lettre"]
http = ["ureq"]
database = ["sqlite"]
sqlite = ["rusqlite"]
mysql_db = ["dep:mysql"]
postgres_db = ["dep:postgres", "dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:rustls-native-certs", "dep:rust_decimal", "dep:uuid"]
mssql_db = ["dep:tiberius", "dep:tokio", "dep:tokio-util", "tokio?/rt-multi-thread"]
all-databases = ["sqlite", "mysql_db", "postgres_db", "mssql_db"]
xml = ["quick-xml"]
html = ["scraper", "ego-tree"]
zip_support = ["dep:zip"]
s3 = ["dep:aws-sdk-s3", "dep:aws-config", "dep:aws-credential-types", "dep:tokio", "tokio?/rt-multi-thread"]

[dependencies]
cfml-common = { workspace = true }
indexmap = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = "0.4"
chrono-tz = { workspace = true }
regex = "1"
fancy-regex = "0.18"
once_cell = "1"
sha2 = "0.10"
md-5 = "0.10"
serde_json = "1"
serde_yaml = { version = "0.9", optional = true }
jsonschema = { version = "0.46", optional = true, default-features = false }
sha1 = "0.10"
ureq = { version = "2", optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
mysql = { version = "28", optional = true }
postgres = { version = "0.19", optional = true, features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
tokio-postgres = { version = "0.7", optional = true }
tokio-postgres-rustls = { version = "0.14", optional = true }
rustls = { version = "0.23", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
rust_decimal = { version = "1", default-features = false, features = ["db-postgres"], optional = true }
uuid = { version = "1", optional = true }
# native-tls (tiberius's default TLS) instead of its `rustls` feature, which
# hard-pins tokio-rustls 0.24 → rustls 0.21 + rustls-webpki 0.101 (RUSTSEC).
# tiberius 0.12.3 is the latest and has no rustls-0.23 path. native-tls uses the
# OS TLS stack / vendored openssl (already vendored globally via the cli's
# memcache openssl dep). MSSQL is not built for the wasm targets.
tiberius = { version = "0.12", default-features = false, features = ["native-tls", "chrono", "tds73"], optional = true }
tokio = { version = "1", features = ["rt", "net"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
r2d2 = "0.8"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
des = "0.8"
blowfish = "0.9"
hmac = "0.12"
rand = { version = "0.8", optional = true }
bcrypt = { version = "0.15", optional = true }
scrypt = { version = "0.11", optional = true }
argon2 = { version = "0.5", optional = true }
pbkdf2 = { version = "0.12", optional = true, features = ["simple"] }
iana-time-zone = "0.1"
quick-xml = { version = "0.36", optional = true }
# Pure-Rust imaging (decode/encode/resize/rotate/crop/flip). `default-features`
# left ON — all default codecs are pure-Rust and build for wasm32. Do NOT enable
# `avif`/`avif-native`/`hdr`-via-C: those pull C deps and break the wasm build.
image = { version = "0.25", optional = true }
# Tier 2/3 drawing, filters and geometric transforms. `default-features = false`
# drops imageproc's `rayon` feature (threads → not wasm32-safe); we only need the
# single-threaded drawing/filter/transform routines, which are pure-Rust.
imageproc = { version = "0.27", optional = true, default-features = false, features = ["text"] }
# Font rasterization for imageDrawText / cfimage captcha. Pure-Rust, wasm-safe.
ab_glyph = { version = "0.2", optional = true }
# EXIF metadata reader (imageGetEXIFMetadata/Tag). Pure-Rust, wasm-safe. IPTC is
# hand-parsed from the JPEG APP13 segment (no maintained pure-Rust IPTC crate).
kamadak-exif = { version = "0.6", optional = true }
scraper = { version = "0.22", optional = true }
ego-tree = { version = "0.10", optional = true }
# Pure-Rust xlsx read+edit+write (POI-model round-trip: styles/charts/images
# preserved). Primary spreadsheet engine. Native-only (see `spreadsheet` feature).
umya-spreadsheet = { version = "3", optional = true }
# Pure-Rust reader for legacy .xls (BIFF), .xlsb and .ods that umya can't open.
# Data-only (styles dropped) — used for SpreadsheetRead of legacy formats.
calamine = { version = "0.36", optional = true }
# Pure-Rust image-dimension probe (already in umya's tree) — lets addImage accept
# raw bytes by supplying width/height to umya's new_image_with_dimensions.
imagesize = { version = "0.14", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
# `rustls-tls` (as distinct from `tokio1-rustls-tls`) is what enables TLS on the
# BLOCKING `SmtpTransport` we actually use for <cfmail>. Without it the only
# constructor available is `builder_dangerous`, i.e. no STARTTLS and no implicit
# TLS — SMTP credentials went out in plaintext even when tls/ssl were requested.
# It pulls no new crates: rustls/webpki-roots are already in lettre's tree.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls", "rustls-tls"], optional = true }
# Use the modern HTTPS connector (aws-lc-rs + rustls 0.23) rather than the
# legacy `rustls` feature, which resolves to aws-smithy's `legacy-rustls-ring`
# (rustls 0.21 + hyper-rustls 0.24 — flagged by RUSTSEC/rustls-webpki 0.101).
# `default-https-client` pulls aws-smithy-http-client's `rustls-aws-lc`.
aws-sdk-s3 = { version = "1", optional = true, default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-config = { version = "1", optional = true, default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-credential-types = { version = "1", optional = true }
