[package]
name = "cfml-worker"
description = "Cloudflare Workers host glue for RustCFML — request routing, scope population, Application.cfc lifecycle, and KV/Hyperdrive plug-points."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lib]
# Plain rlib — the host project supplies the cdylib that workers-build consumes.
crate-type = ["rlib"]

[dependencies]
cfml-common = { path = "../cfml-common" }
cfml-compiler = { path = "../cfml-compiler" }
cfml-codegen = { path = "../cfml-codegen" }
cfml-vm = { path = "../cfml-vm", default-features = false, features = ["std"] }
# Re-add the wasm-compatible stdlib features (see crates/wasm/Cargo.toml for the
# rationale). Native-only http/database/smtp stay OUT — the worker provides those
# via JS bindings (fetch, D1). getrandom's `js` backend (Web Crypto) works in the
# Workers runtime, satisfying `security`→rand.
cfml-stdlib = { path = "../cfml-stdlib", default-features = false, features = ["xml", "html", "yaml", "jsonschema", "zip_support", "security"] }
cfml-config = { path = "../cfml-config" }
indexmap = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# `security`→rand→getrandom needs its `js` backend (Web Crypto) on wasm32.
getrandom = { version = "0.2", features = ["js"] }
