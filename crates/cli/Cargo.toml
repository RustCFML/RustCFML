[package]
name = "rustcfml-cli"
description = "CFML (ColdFusion Markup Language) interpreter and self-contained app builder, written in Rust. Provides the `rustcfml` binary and a library for embedding the runtime in `rustcfml --build`-produced binaries that include native Rust modules."
keywords = ["cfml", "coldfusion", "interpreter", "lucee", "boxlang"]
categories = ["command-line-utilities", "compilers", "web-programming"]
readme = "../../README.md"
documentation = "https://docs.rs/rustcfml-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
# Not published to crates.io — RustCFML ships as binaries. This also keeps
# first-party crates out of THIRD-PARTY.txt: cargo-about only omits
# workspace members that are unpublished, and listing them there made the
# generated notice churn on every version bump (breaking the CI staleness
# gate on every release). Our own terms live in the top-level LICENSE.
publish = false

[lib]
name = "rustcfml_cli"
path = "src/lib.rs"

[[bin]]
name = "rustcfml"
path = "src/main.rs"

[dependencies]
cfml-common = { workspace = true }
cfml-config = { workspace = true }
cfml-compiler = { workspace = true }
cfml-codegen = { workspace = true }
cfml-qoq = { workspace = true }
# Features listed explicitly rather than taking cfml-vm's defaults, so what the
# CLI links is visible here.
cfml-vm = { workspace = true, default-features = false, features = [
    "s3",
    "std",
    "real-threads",
    "observability",
    "scope-pool",
    "component-instance",
] }
cfml-module-abi = { workspace = true }
indexmap = { workspace = true }
cfml-stdlib = { workspace = true, features = ["default", "all-databases", "s3"] }
log = { workspace = true }
env_logger = "0.11"
clap = { version = "4.0", features = ["derive"] }
anyhow = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
# Only for `LengthLimitError`: lets a body-read failure be classified as a real
# over-limit (413) rather than lumping every transport error in with it.
http-body-util = "0.1"
# Static-asset conditional GET (Last-Modified/If-Modified-Since parsing and
# formatting). Already in the dependency graph via hyper — zero extra weight.
httpdate = "1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "sync", "time", "signal", "fs"] }
regex = "1"
multer = "3"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Dynamic native extensions (.rcx). ISC-licensed, no transitive deps beyond the
# platform loader; used only on native targets — the wasm builds never see it.
libloading = "0.8"
# .rcx is a zip. Same crate (and same feature set) the spreadsheet support
# already pulls in, so this adds nothing to the graph.
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
memcache = { version = "0.17", optional = true }
# memcache enables its `tls` feature by default, which pulls in native openssl.
# `vendored` compiles OpenSSL from source and statically links it, so the build
# needs no system OpenSSL — required for the Windows MSVC release runner, and it
# makes the distributed binaries self-contained on every platform.
openssl = { version = "0.10", features = ["vendored"], optional = true }
memberlist = { version = "0.8", optional = true, default-features = false, features = ["tokio", "tcp", "serde"] }
automerge = { version = "0.9", optional = true }
bincode = { version = "2", optional = true, features = ["serde"] }
socket2 = { version = "0.5", optional = true, features = ["all"] }
# socket.io transport (Phase 3). Default features only — the modern socket.io
# client speaks Engine.IO v4 (socketioxide's default); we own fan-out via our
# own registry/Broker, so `state`/`extensions`/`v4` are unnecessary.
socketioxide = "0.16.3"
# Heap profiler (leak hunting). Off by default; build with `--features dhat-heap`
# to swap in DHAT's global allocator and dump `dhat-heap.json` on clean shutdown.
dhat = { version = "0.3", optional = true }
# Stack capture for the `memprofile` sampling heap profiler. Already in the tree
# transitively (pprof, dhat); declared explicitly so the feature owns it.
backtrace = { version = "0.3", optional = true }
# Alternative global allocator (feature `mimalloc`). ~27% of a warm request is
# allocator work and the default build uses the system malloc, which on macOS is
# libmalloc — the slowest mainstream allocator for high-churn small allocations.
mimalloc = { version = "0.1", optional = true, default-features = false }

# ── OpenTelemetry (observability Phase 3) — host-only, behind `obs-otel` ──
# Pinned as a compatible set (all track the opentelemetry 0.32 line). OTLP export
# uses HTTP/protobuf (reqwest) rather than gRPC/tonic to keep the dep tree light;
# the thread-based BatchSpanProcessor exports traces off the request path. RED
# metrics are exposed via a native Prometheus scrape endpoint using the standalone
# `prometheus` crate — deliberately NOT `opentelemetry-prometheus`, whose 0.31
# release lags the 0.32 core line and would fork the dependency tree onto two
# incompatible `opentelemetry` versions. None of these reach the wasm crates.
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true, features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", optional = true, default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry-semantic-conventions = { version = "0.32", optional = true }
prometheus = { version = "0.14", optional = true }

[features]
default = ["memcached", "cluster", "component-instance", "mimalloc"]
# OpenTelemetry distributed traces (OTLP push) + RED metrics (native Prometheus
# scrape endpoint). Host-only; never enabled by the wasm crates. Implies the VM's
# `observability` hook bus.
obs-otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-semantic-conventions", "dep:prometheus", "opentelemetry_sdk/testing"]
# Native CPU/wall-clock sampling profiler (`--profile`), emitting a flamegraph +
# pprof protobuf. Unix-only (uses SIGPROF/setitimer) — the `pprof` dependency is
# declared under the unix target table; never built for wasm or Windows.
obs-pprof = ["dep:pprof"]
# GH#297 sizing: struct-allocation call-site attribution appended to the
# RUSTCFML_COUNTERS report. Sizing builds only — see cfml-common/Cargo.toml.
alloc-sizing = ["cfml-common/alloc-sizing"]
probe-sites = ["cfml-common/probe-sites"]
op-census = ["cfml-common/op-census", "cfml-vm/op-census"]
# Per-BIF call + argument-shape census (performance plan Part 1 Step 0) — see
# cfml-common/Cargo.toml. Sizing builds only.
bif-census = ["cfml-common/bif-census", "cfml-vm/bif-census"]
call-phases = ["cfml-common/call-phases", "cfml-vm/call-phases"]
# Per-frame exclusive accounting. Also swaps in a counting global allocator
# (wrapping mimalloc) so allocations can be attributed per frame.
frame-census = ["cfml-common/frame-census", "cfml-vm/frame-census"]
# Existence-probe outcome census (known-issues §45 sizing) — see
# cfml-common/Cargo.toml. Sizing builds only.
exists-census = ["cfml-common/exists-census", "cfml-vm/exists-census"]
# Enable DHAT heap profiling. Adds a global allocator + a Profiler held for the
# whole process lifetime; writes dhat-heap.json on graceful (Ctrl+C) shutdown.
dhat-heap = ["dep:dhat"]
# Sampling heap profiler (`--memprofile`). Unlike `dhat-heap` this installs a
# global allocator that is INERT until armed at runtime (one relaxed atomic load
# per allocator call when off), so one binary can serve normally and be asked for
# a heap profile on demand via SIGUSR2. Emits pprof protobuf + collapsed stacks
# for both inuse_space and alloc_space. Unix-only (SIGUSR2). Mutually exclusive
# with `dhat-heap` — only one global allocator can be installed.
memprofile = ["dep:backtrace"]
# Swap the system allocator for mimalloc. **DEFAULT-ON as of v0.590.0**: measured
# -15.6% warm CPU and -18.9% boot on the live Preside site for +1.8% peak RSS,
# because ~27% of a warm request is allocator work and the platform mallocs (macOS
# libmalloc especially) are poor at high-churn small allocations. Opt out with
# `--no-default-features` or by building a profiling variant. Mutually exclusive
# with the two profiler allocators above (only one `#[global_allocator]` can
# exist); the cfg in `main.rs` gives `dhat-heap`/`memprofile` precedence so a
# profiling build still profiles. Zero effect on the wasm crates, which never
# depend on the CLI.
mimalloc = ["dep:mimalloc"]
memcached = ["dep:memcache", "dep:openssl"]
cluster = ["dep:memberlist", "dep:automerge", "dep:bincode", "dep:socket2"]
# Phase C (component-model flyweight): passthrough to the VM's `Instance` backing.
# DEFAULT-ON as of v0.519.0 (the Slice-6 flip); also reaches the binary transitively
# via cfml-vm's default. The wasm crates opt out (default-features = false), so the
# demo/worker keep the marker representation.
component-instance = ["cfml-vm/component-instance"]

[dev-dependencies]
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Native sampling profiler (obs-pprof feature). Unix-only: pprof-rs uses SIGPROF.
pprof = { version = "0.15", optional = true, features = ["flamegraph", "protobuf-codec"] }
