[package]
name = "cfml-codegen"
description = "Walks the cfml-compiler AST and emits bytecode for cfml-vm. Includes optimisation passes such as counted-loop fusion."
keywords = ["cfml", "coldfusion", "bytecode", "codegen", "rustcfml"]
categories = ["compilers"]
readme = "../../README.md"
documentation = "https://docs.rs/cfml-codegen"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
# Not published to crates.io — RustCFML ships as binaries. This also keeps
# first-party crates out of THIRD-PARTY.txt: cargo-about only omits
# workspace members that are unpublished, and listing them there made the
# generated notice churn on every version bump (breaking the CI staleness
# gate on every release). Our own terms live in the top-level LICENSE.
publish = false

[dependencies]
cfml-common = { workspace = true }
cfml-compiler = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
