[package]
name = "cfml-common"
description = "Core value types (CfmlValue, CfmlError) and trait surface (CfmlNative, Vfs) shared across the RustCFML compiler, VM, and stdlib."
keywords = ["cfml", "coldfusion", "rustcfml"]
categories = ["data-structures", "compilers"]
readme = "../../README.md"
documentation = "https://docs.rs/cfml-common"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
# Not published to crates.io — RustCFML ships as binaries. This also keeps
# first-party crates out of THIRD-PARTY.txt: cargo-about only omits
# workspace members that are unpublished, and listing them there made the
# generated notice churn on every version bump (breaking the CI staleness
# gate on every release). Our own terms live in the top-level LICENSE.
publish = false

[features]
# Component-model flyweight prototype (Phase C.2). OFF by default: gates the
# ClassBlueprint/Instance types (and, later, the CfmlValue::Instance variant +
# producer). A default build is byte-identical to before this feature existed.
# See COMPONENT_MODEL_PHASE_C2_PROTOTYPE.md.
component-instance = []
# Struct-allocation call-site attribution (counter-first lever sizing for
# GH#297). Puts `#[track_caller]` on the CfmlStruct constructor chain and
# records a per-call-site count, appended to the RUSTCFML_COUNTERS report.
# Sizing builds only — adds a Location argument to every hot constructor call
# plus a Mutex'd map bump per construction. Never ship a release with this on.
alloc-sizing = []
# Dynamic op census (P3/P4 sizing) — the VM's dispatch loop bumps one relaxed
# atomic add per EXECUTED bytecode op, so the Tier-0 JIT can be sized against
# the mix Preside really runs instead of the static op-weight scan. Probe builds
# only; a default build has no counter and no branch. See PERFORMANCE_ROADMAP P3.
op-census = []
# UDF call-prologue phase attribution (the 2026-08-11 lever: ~640ns of frame
# setup per call). Times each prologue phase with a real clock, so it perturbs
# the very thing it measures — read it for SHARES, never as an absolute. Probe
# builds only.
call-phases = []
# Existence-probe outcome census (known-issues §45 sizing). The shipped
# EXISTS_MEMO_HITS / EXISTS_FS_PROBES pair cannot answer the question that
# decides the fix, because the memo holds POSITIVES ONLY: a negative probe can
# never be a hit, so the hit-rate is structurally blind to the traffic that
# dominates. This feature classifies every probe by outcome AND by whether the
# same path was already probed (this request / an earlier one), which is what
# separates recoverable repeats from irreducible first looks. Keeps a
# Mutex'd map of every probed path, so it is a sizing build only — never ship it.
exists-census = []

[dependencies]
thiserror = { workspace = true }
parking_lot = { workspace = true }
indexmap = { workspace = true }
rustc-hash = { workspace = true }
num-traits = { workspace = true }
log = { workspace = true }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
